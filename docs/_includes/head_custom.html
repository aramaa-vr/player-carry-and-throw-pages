<meta name="theme-color" content="#dd739e">
{% assign page_title = page.title | default: site.title | escape %}
{% assign page_desc = page.description | default: site.description | escape %}
{% assign page_url = page.url | absolute_url %}
<link rel="canonical" href="{{ page_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_desc }}">
<meta property="og:url" content="{{ page_url }}">
<meta property="og:image" content="{{ '/assets/img/manual-title-1280.webp' | absolute_url }}">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:image:alt" content="だこちてギミック【ワールド版】説明書">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ '/assets/img/manual-title-1280.webp' | absolute_url }}">
<meta name="twitter:image:alt" content="だこちてギミック【ワールド版】説明書">
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
